[project]
name = "langchain-agent-engineer-mastery"
version = "0.1.0"
description = "An incremental, tested agent engineering curriculum"
requires-python = ">=3.11,<3.14"
dependencies = ["langchain==1.2.12", "langchain-openai==1.1.11", "streamlit==1.55.0", "python-dotenv==1.2.2", "langchain-text-splitters==1.1.1", "langgraph-checkpoint-sqlite==3.0.3", "pypdf==6.9.1", "deepagents==0.4.11", "mcp==1.26.0", "langchain-mcp-adapters==0.2.2", "anyio==4.12.1", "fastapi==0.135.1", "uvicorn==0.54.0"]
[project.optional-dependencies]
test = ["pytest==9.0.2"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["portal"]
